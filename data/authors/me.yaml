bio: |
  Chung-Won Woo is an Associate Professor of Accounting at Changwon National
  University. His empirical research examines how carbon regulation (EU CBAM),
  climate risk, ESG, innovation strategy, and information-security investment
  show up in firms' costs, disclosures, audits, and market value. He has 39+
  peer-reviewed publications and 1,450+ citations, and previously served as a
  Research Fellow at the Science and Technology Policy Institute (STEPI).

